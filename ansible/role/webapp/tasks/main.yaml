---
# Application Deployment Role
- name: Install Git and Apache web server
  ansible.builtin.apt:
    name:
      - git
      - apache2
    state: present
    update_cache: yes

- name: Clone web application from Git repository
  ansible.builtin.git:
    repo: "{{ app_git_repo }}"
    dest: "{{ app_install_dir }}"
    version: "{{ app_version }}"
    force: yes

- name: Set permissions on application directory
  ansible.builtin.file:
    path: "{{ app_install_dir }}"
    owner: www-data
    group: www-data
    recurse: yes
    mode: '0755'

- name: Deploy Apache VirtualHost configuration from template
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: /etc/apache2/sites-available/webapp.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart Apache

- name: Enable site configuration
  ansible.builtin.command: a2ensite webapp.conf
  args:
    creates: /etc/apache2/sites-enabled/webapp.conf
  notify: Restart Apache

- name: Ensure Apache service is enabled and started
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
