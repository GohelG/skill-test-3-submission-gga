---
# Connectivity & System Cache Update
- name: Connectivity & Cache Update
  hosts: all
  become: true
  tasks:
    - name: Ping all target hosts
      ansible.builtin.ping:

    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: [cache]

# Server Configuration Management (Web & DB)
- name: Server Configuration Management (Web & DB)
  hosts: all
  become: true
  tasks:
    - name: Ensure UFW firewall allows SSH (Port 22)
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Enable UFW
      community.general.ufw:
        state: enabled

- name: Configure Web Tier Servers
  hosts: web
  become: true
  handlers:
    - name: Restart Apache
      ansible.builtin.service:
        name: apache2
        state: restarted

  tasks:
    - name: Install Apache web server
      ansible.builtin.apt:
        name: apache2
        state: present
      notify: Restart Apache

    - name: Allow HTTP (Port 80) in UFW
      community.general.ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Create custom MOTD banner for web servers
      ansible.builtin.copy:
        content: |
          ==============================================
          Host: {{ ansible_hostname }}
          Role: Web Application Server (Managed by Ansible)
          ==============================================
        dest: /etc/motd
        mode: '0644'

- name: Configure Database Tier Servers
  hosts: db
  become: true
  handlers:
    - name: Restart MySQL
      ansible.builtin.service:
        name: mysql
        state: restarted

  tasks:
    - name: Install MySQL server
      ansible.builtin.apt:
        name: mysql-server
        state: present
      notify: Restart MySQL

    - name: Allow MySQL (Port 3306) in UFW
      community.general.ufw:
        rule: allow
        port: '3306'
        proto: tcp

    - name: Create custom MOTD banner for database servers
      ansible.builtin.copy:
        content: |
          ==============================================
          Host: {{ ansible_hostname }}
          Role: MySQL Database Server (Managed by Ansible)
          ==============================================
        dest: /etc/motd
        mode: '0644'

# Role-based Deployment with Environment Variables
- name: Deploy Web Application with Environment Config
  hosts: web
  become: true
  vars_files:
    - "groups_var/all.yml"
    - "groups_var/{{ target_env | default('dev') }}.yml"

  pre_tasks:
    - name: Pre-task - Verify free disk space (> 1GB)
      ansible.builtin.assert:
        that:
          - ansible_mounts[0].size_available > 1073741824
        fail_msg: "Insufficient disk space on host (less than 1GB available)."
      tags: [always]

  roles:
    - role: webapp
      tags: [deploy]

  post_tasks:
    - name: Post-task - Validate local HTTP health check
      ansible.builtin.uri:
        url: "http://localhost:80"
        status_code: [200, 301, 302]
      tags: [validate]
